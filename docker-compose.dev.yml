# Développement local : les emails sont captés par Mailpit au lieu d'être envoyés.
#
#   APP_PORT=8088 docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
#   Application / API : http://localhost:8088  (APP_PORT, 8080 par défaut)
#   Boîte mail de test : http://localhost:8025
services:
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: cotisations-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # interface web

  backend:
    depends_on:
      mailpit:
        condition: service_started
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: no-reply@cotisen.sn
      SMTP_STARTTLS: "false"
      APP_BASE_URL: http://localhost:${APP_PORT:-8080}
