services:
  mysql:
    image: mysql:8.3
    container_name: cotisations-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: cotisations_db
    # Pas d'exposition du port MySQL vers l'extérieur : l'app y accède via le
    # réseau interne Docker. (Pour inspecter la base : docker exec cotisations-mysql ...)
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: cotisations-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
