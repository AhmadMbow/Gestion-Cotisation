upstream backend {
    # "backend" = nom du service Tomcat dans docker-compose.yml
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    # Autorise les imports / uploads volumineux (fichiers Excel, etc.)
    client_max_body_size 25m;

    # --- Ressources statiques servies directement par Nginx ---
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- Tout le reste -> backend Tomcat (JSP, servlets, auth...) ---
    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
