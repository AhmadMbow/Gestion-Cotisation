# Fly.io — service FRONTEND (Nginx : assets + reverse-proxy)
# Seul service PUBLIC : expose l'application sur https://cotisations-frontend.fly.dev
app = "cotisations-frontend"
primary_region = "cdg"

[env]
  BACKEND_HOST = "cotisations-backend.internal"
  BACKEND_PORT = "8080"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
