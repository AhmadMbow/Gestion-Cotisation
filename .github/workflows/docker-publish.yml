name: Build & Push Docker images

# Reconstruit et publie les 3 images sur Docker Hub (ahmaddock/gestion_cotisation)
#   - tag "backend"  : Tomcat + WAR Jakarta EE
#   - tag "frontend" : Nginx (assets + reverse-proxy)
#   - tag "db"       : MySQL + schéma
# à chaque push sur migration-upzet, ou manuellement via "Run workflow".
on:
  push:
    branches:
      - migration-upzet
  workflow_dispatch:

env:
  IMAGE: ahmaddock/gestion_cotisation

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: Dockerfile
          - component: frontend
            context: .
            dockerfile: frontend/Dockerfile
          - component: db
            context: ./database
            dockerfile: ./database/Dockerfile
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push (${{ matrix.component }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.component }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
